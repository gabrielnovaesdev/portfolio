      <div class="photo">
        <img src="assets/gabriel.webp" alt="" width="1254" height="1254" decoding="async" fetchpriority="high" />
      </div>
      <div class="word word--solid">
        <span class="l"><span>P</span></span>
        <span class="l"><span>O</span></span>
        <span class="l"><span>R</span></span>
        <span class="l"><span>T</span></span>
        <span class="l"><span>F</span></span>
        <span class="l"><span>O</span></span>
        <span class="l"><span>L</span></span>
        <span class="l"><span>I</span></span>
        <span class="l"><span>O</span></span>
      </div>
      <div class="photo photo--head">
        <img src="assets/gabriel-head.webp" alt="" width="1254" height="1254" decoding="async" />
      </div>
      <div class="word word--outline">
        <span class="l"><span>P</span></span>
        <span class="l"><span>O</span></span>
        <span class="l"><span>R</span></span>
        <span class="l"><span>T</span></span>
        <span class="l"><span>F</span></span>
        <span class="l"><span>O</span></span>
        <span class="l"><span>L</span></span>
        <span class="l"><span>I</span></span>
        <span class="l"><span>O</span></span>
      </div>
    </div>

    <h1 class="sr-only">Gabriel Novaes — Portfolio</h1>

    <p class="label label--tl">Developer &amp; AI</p>
    <a class="arrow" href="#projetos" aria-label="Ver projetos">
      <svg viewBox="0 0 90 20" fill="none" aria-hidden="true">
        <path class="arrow__line" d="M0 10H88" />
        <path class="arrow__head" d="M79 1.5L88 10L79 18.5" />
      </svg>
    </a>
    <p class="label label--bl">Gabriel Novaes</p>
    <a class="label label--br" href="https://github.com/gabrielnovaesdev" target="_blank" rel="noopener">github.com/gabrielnovaesdev</a>
  </header>

  <main>
    <section class="projects" id="projetos" aria-label="Projetos">
